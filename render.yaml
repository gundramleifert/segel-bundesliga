# One-click deploy of both services on Render's free tier — for testing only.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard → "New" → "Blueprint" → pick the repo.
#   3. Deploy. The API URL is https://sbl-api.onrender.com, the site
#      https://sbl-web.onrender.com (Render appends a suffix if the name is taken —
#      then fix the rewrite `destination` below to match and redeploy).
#
# Notes:
#   * Free web services sleep after 15 min idle; the first request then takes ~1 min.
#   * The database is baked into the image (SQLite). A restart or redeploy resets it to
#     the seeded state. That is intentional here — no backup, no external DB.
#   * SBL_DEV_LOGIN=true lets anyone sign in as any role without verification. Fine for a
#     private test URL; never do this for anything real. See docs/deploy.md.

services:
  - type: web
    name: sbl-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SBL_JWT_SECRET
        generateValue: true
      - key: SBL_DEV_LOGIN
        value: "true"
      - key: SBL_ALLOW_REGISTRATION
        value: "false"
      # Same-origin via the rewrite below, so CORS isn't needed. Set this to the site URL
      # if you ever call the API cross-origin.
      - key: SBL_CORS_ORIGINS
        value: '["https://sbl-web.onrender.com"]'
      # SMTP, for the email one-time-code sign-in (the only sign-in method the UI offers
      # today). Without these, app.mail falls back to just logging the code — fine for
      # SBL_DEV_LOGIN=true, useless once that's turned off. `sync: false` means Render
      # prompts for the value once in the dashboard during the initial Blueprint launch
      # and stores it there — it is never written into this file. See docs/deploy.md.
      #
      # Two different encryption schemes, not interchangeable — check your provider's own
      # docs rather than assuming: STARTTLS upgrades a plaintext connection (usually port
      # 587); implicit TLS/SSL encrypts from the first byte (usually port 465) — some
      # providers (e.g. STRATO) document that as the path for normal mail clients and
      # 587/STARTTLS as relay-only. PORT and SSL are `sync: false` alongside the rest so a
      # provider-specific choice made in the dashboard is never silently reverted by a
      # later Blueprint re-sync — this deployment currently uses STRATO (port 465, SSL).
      - key: SBL_SMTP_HOST
        sync: false
      - key: SBL_SMTP_PORT
        sync: false
      - key: SBL_SMTP_USER
        sync: false
      - key: SBL_SMTP_PASSWORD
        sync: false
      - key: SBL_SMTP_STARTTLS
        value: "true"
      - key: SBL_SMTP_SSL
        sync: false
      - key: SBL_MAIL_FROM
        sync: false

  - type: web
    name: sbl-web
    runtime: static
    rootDir: web
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # The SPA calls /api/... relative; proxy that to the backend so the browser stays
      # same-origin. Order matters — this must come before the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://sbl-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
