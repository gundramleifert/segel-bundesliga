# One-click deploy of both services on Render's free tier — for testing only.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard → "New" → "Blueprint" → pick the repo.
#   3. Deploy. The API URL is https://sbl-api.onrender.com, the site
#      https://sbl-web.onrender.com (Render appends a suffix if the name is taken —
#      then fix the rewrite `destination` below to match and redeploy).
#
# Notes:
#   * Free web services sleep after 15 min idle; the first request then takes ~1 min.
#   * The database is baked into the image (SQLite). A restart or redeploy resets it to
#     the seeded state. That is intentional here — no backup, no external DB.
#   * SBL_DEV_LOGIN=true lets anyone sign in as any role without verification. Fine for a
#     private test URL; never do this for anything real. See docs/deploy.md.

services:
  - type: web
    name: sbl-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # No env vars at all for sbl-api, deliberately — not even the non-secret ones. Two
    # reasons: an env var is visible in the Dashboard, in `render env`/API dumps, and to
    # anything that can read the process environment; and a `sync: false` var only ever
    # gets auto-created the first time a service is provisioned from a Blueprint — adding
    # one to this file later does nothing for a service that already exists (that's
    # exactly what cost real time to track down here). Every setting instead goes into a
    # Secret File on this service's Environment tab in the Dashboard (Environment →
    # Secret Files → Add Secret File), named *exactly* like the setting it configures —
    # e.g. a file named `SBL_SMTP_HOST` containing just `smtp.strato.de`. app.config reads
    # each one from /etc/secrets/<that name> automatically (see `_SECRETS_DIR` there); it
    # works the same whether the value is genuinely secret (`SBL_JWT_SECRET`,
    # `SBL_SMTP_PASSWORD`) or just deployment-specific (`SBL_DEV_LOGIN`,
    # `SBL_CORS_ORIGINS`, …) — one mechanism for all of it. Full list and rationale in
    # docs/deploy.md.

  - type: web
    name: sbl-web
    runtime: static
    rootDir: web
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # The SPA calls /api/... relative; proxy that to the backend so the browser stays
      # same-origin. Order matters — this must come before the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://sbl-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
