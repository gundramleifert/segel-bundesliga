# One-click deploy of both services on Render's free tier — for testing only.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard → "New" → "Blueprint" → pick the repo.
#   3. Deploy. The API URL is https://sbl-api.onrender.com, the site
#      https://sbl-web.onrender.com (Render appends a suffix if the name is taken —
#      then fix the rewrite `destination` below to match and redeploy).
#
# Notes:
#   * Free web services sleep after 15 min idle; the first request then takes ~1 min.
#   * The database is baked into the image (SQLite). A restart or redeploy resets it to
#     the seeded state. That is intentional here — no backup, no external DB.
#   * SBL_DEV_LOGIN=true lets anyone sign in as any role without verification. Fine for a
#     private test URL; never do this for anything real. See docs/deploy.md.

services:
  - type: web
    name: sbl-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # No env vars declared for sbl-api at all, deliberately. Render's dashboard Environment
    # Variables proved unreliable to actually apply here — `sync: false` slots that were
    # never created, `value:` entries that showed up empty — costing real time to track
    # down (see docs/deploy.md). Every non-secret setting is instead baked directly into
    # the image at build time (api/render.env, copied to .env by the Dockerfile) — a plain
    # code change, deployed by the same git push as everything else, with nothing left to
    # configure by hand in a dashboard. The two real credentials, SBL_JWT_SECRET and
    # SBL_SMTP_PASSWORD, are the one exception: they stay out of git entirely, as Render
    # Secret Files (this service's Environment tab → Secret Files → Add Secret File,
    # named exactly `SBL_JWT_SECRET` / `SBL_SMTP_PASSWORD`) — app.config reads those from
    # /etc/secrets/<name> (see `_SECRETS_DIR`), and Secret Files aren't subject to the
    # same Blueprint-sync unreliability since they live outside it entirely.

  - type: web
    name: sbl-web
    runtime: static
    rootDir: web
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # The SPA calls /api/... relative; proxy that to the backend so the browser stays
      # same-origin. Order matters — this must come before the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://sbl-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
