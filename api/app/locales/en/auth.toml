# What the sign-in routes answer in their own words (app/routers/auth.py).

[register]
sent = "We've sent a confirmation code. It's valid for {minutes} minutes. If an account already existed for this address, it's the usual sign-in code."

[email_request]
sent = "If an account exists for this address, a code is on its way. It's valid for {minutes} minutes."
