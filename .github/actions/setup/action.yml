name: setup
description: Python and uv, Node and pnpm, and every dependency.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with: { python-version: "3.12", enable-cache: true, cache-dependency-glob: api/uv.lock }
    - uses: pnpm/action-setup@v4
      with: { version: 11.24.0 }
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          web/pnpm-lock.yaml
    - name: Install
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        (cd web && pnpm install --frozen-lockfile)
        (cd api && uv sync --frozen)

