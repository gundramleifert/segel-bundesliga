# The whole site on one machine: Postgres, the API, the SPA behind Caddy, and SeaweedFS.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then set the secrets in it
#   docker compose -f deploy/compose/compose.yaml up --build -d
#
# See deploy/compose/README.md.
name: segelliga

# The API's settings: .env as it is (every SBL_* of api/app/config.py may go there, the
# tracking constants included), plus what the stack decides itself and the secrets, which
# compose.sh hands over as environment from secrets.sops.env rather than as a file.
x-api: &api
  build:
    context: ../..
    dockerfile: deploy/compose/api.Dockerfile
  image: segelliga-api:local
  env_file:
    - path: .env
      required: false
  environment: &api-env
    SBL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sbl}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/secrets.sops.env (or .env)}@db:5432/${POSTGRES_DB:-sbl}
    # Uploads are always in S3 here — SeaweedFS below by default, or any S3 provider named by
    # the SBL_S3_* settings (README.md, "Uploads"). The containers keep no files of their own.
    SBL_STORAGE: s3
    SBL_S3_ENDPOINT_URL: ${SBL_S3_ENDPOINT_URL:-http://storage:8333}
    SBL_S3_BUCKET: ${SBL_S3_BUCKET:-sbl-uploads}
    SBL_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/compose/secrets.sops.env (or .env)}
    SBL_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/compose/secrets.sops.env (or .env)}
    SBL_JWT_SECRET: ${SBL_JWT_SECRET:?set SBL_JWT_SECRET in deploy/compose/secrets.sops.env (or .env)}
    SBL_SMTP_PASSWORD: ${SBL_SMTP_PASSWORD:-}
    # Differ from config.py's development defaults.
    SBL_DEBUG: ${SBL_DEBUG:-false}
    SBL_CORS_ORIGINS: ${SBL_CORS_ORIGINS:-["http://localhost:8080"]}
  depends_on: &api-depends
    db:
      condition: service_healthy
    storage:
      condition: service_healthy
      required: false # not started when an outside S3 provider is used

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/secrets.sops.env (or .env)}
      POSTGRES_DB: ${POSTGRES_DB:-sbl}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrate, and seed an empty database (deploy/compose/api-init.sh).
  db-setup:
    <<: *api
    command: ["api-init"]
    environment:
      <<: *api-env
      # true only on a demonstration server: publishes the invented demo series.
      SEED_PUBLISH_DEMO: ${SEED_PUBLISH_DEMO:-false}
    restart: "no"

  # Its healthcheck is the image's (api.Dockerfile).
  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      <<: *api-depends
      db-setup:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/web.Dockerfile
      args:
        # The role switcher is compiled in only together with the dev login.
        VITE_DEV_TOOLS: ${SBL_DEV_LOGIN:-false}
    image: segelliga-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Object storage with an S3 gateway: where the uploads go unless an outside provider does.
  storage:
    image: chrislusf/seaweedfs:3.97
    # In the profile `seaweedfs`, which .env.example turns on (COMPOSE_PROFILES): leave it
    # out there to use an outside S3 provider instead.
    profiles: [seaweedfs]
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -volume.max=0
      # Explicitly off: `weed server` preallocates every volume (1 GB each, seven per
      # bucket) although `-h` says the default is off — two buckets took 14 GB of disk.
      - -master.volumePreallocate=false
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3.json
    volumes:
      - storage-data:/data
    ports:
      - "${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

configs:
  # Credentials come from .env, so none is committed. One identity with every right.
  s3-config:
    content: |
      {
        "identities": [
          {
            "name": "sbl",
            "credentials": [
              {
                "accessKey": "${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/compose/secrets.sops.env (or .env)}",
                "secretKey": "${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/compose/secrets.sops.env (or .env)}"
              }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }

volumes:
  db-data:
  storage-data:
