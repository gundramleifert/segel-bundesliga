# The whole site on one machine: Postgres, the API, the SPA behind Caddy, and SeaweedFS.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then set the secrets in it
#   docker compose -f deploy/compose/compose.yaml up --build -d
#
# See deploy/compose/README.md.
name: segelliga

x-api-env: &api-env
  SBL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sbl}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}@db:5432/${POSTGRES_DB:-sbl}
  # Uploads: "s3" keeps them in SeaweedFS below, "local" in the `uploads` volume.
  SBL_STORAGE: ${SBL_STORAGE:-s3}
  SBL_UPLOADS_DIR: /data/uploads
  SBL_S3_ENDPOINT_URL: ${SBL_S3_ENDPOINT_URL:-http://storage:8333}
  SBL_S3_REGION: ${SBL_S3_REGION:-us-east-1}
  SBL_S3_BUCKET: ${SBL_S3_BUCKET:-sbl-uploads}
  SBL_S3_PREFIX: ${SBL_S3_PREFIX:-}
  SBL_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/compose/.env}
  SBL_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/compose/.env}
  SBL_S3_CACHE_SECONDS: ${SBL_S3_CACHE_SECONDS:-300}
  SBL_JWT_SECRET: ${SBL_JWT_SECRET:?set SBL_JWT_SECRET in deploy/compose/.env}
  SBL_JWT_LIFETIME_MINUTES: ${SBL_JWT_LIFETIME_MINUTES:-720}
  SBL_DEBUG: ${SBL_DEBUG:-false}
  SBL_DEV_LOGIN: ${SBL_DEV_LOGIN:-false}
  SBL_CORS_ORIGINS: ${SBL_CORS_ORIGINS:-["http://localhost:8080"]}
  SBL_PAIRING_TIMEOUT_SECONDS: ${SBL_PAIRING_TIMEOUT_SECONDS:-1800}
  SBL_GOOGLE_CLIENT_ID: ${SBL_GOOGLE_CLIENT_ID:-}
  SBL_MICROSOFT_CLIENT_ID: ${SBL_MICROSOFT_CLIENT_ID:-}
  SBL_MICROSOFT_TENANT: ${SBL_MICROSOFT_TENANT:-common}
  SBL_OTP_LENGTH: ${SBL_OTP_LENGTH:-6}
  SBL_OTP_LIFETIME_MINUTES: ${SBL_OTP_LIFETIME_MINUTES:-10}
  SBL_OTP_MAX_ATTEMPTS: ${SBL_OTP_MAX_ATTEMPTS:-5}
  SBL_ALLOW_SELF_SIGNUP: ${SBL_ALLOW_SELF_SIGNUP:-false}
  SBL_ALLOW_REGISTRATION: ${SBL_ALLOW_REGISTRATION:-true}
  SBL_ALLOW_PASSWORD_LOGIN: ${SBL_ALLOW_PASSWORD_LOGIN:-true}
  SBL_ADMIN_EMAILS: ${SBL_ADMIN_EMAILS:-[]}
  SBL_SMTP_HOST: ${SBL_SMTP_HOST:-}
  SBL_SMTP_PORT: ${SBL_SMTP_PORT:-587}
  SBL_SMTP_USER: ${SBL_SMTP_USER:-}
  SBL_SMTP_PASSWORD: ${SBL_SMTP_PASSWORD:-}
  SBL_SMTP_STARTTLS: ${SBL_SMTP_STARTTLS:-true}
  SBL_SMTP_SSL: ${SBL_SMTP_SSL:-false}
  SBL_MAIL_FROM: ${SBL_MAIL_FROM:-noreply@deutsche-segelliga.de}
  SBL_BREVO_API_KEY: ${SBL_BREVO_API_KEY:-}

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sbl}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrate, and seed an empty database (deploy/compose/api-init.sh).
  db-setup:
    build:
      context: ../..
      dockerfile: deploy/compose/api.Dockerfile
    image: segelliga-api:local
    command: ["api-init"]
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/api.Dockerfile
    image: segelliga-api:local
    restart: unless-stopped
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/web.Dockerfile
      args:
        # The role switcher is compiled in only together with the dev login.
        VITE_DEV_TOOLS: ${SBL_DEV_LOGIN:-false}
    image: segelliga-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Object storage with an S3 gateway: where the uploads go while SBL_STORAGE=s3.
  storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -volume.max=0
      # Explicitly off: `weed server` preallocates every volume (1 GB each, seven per
      # bucket) although `-h` says the default is off — two buckets took 14 GB of disk.
      - -master.volumePreallocate=false
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3.json
    volumes:
      - storage-data:/data
    ports:
      - "${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

configs:
  # Credentials come from .env, so none is committed. One identity with every right.
  s3-config:
    content: |
      {
        "identities": [
          {
            "name": "sbl",
            "credentials": [
              {
                "accessKey": "${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/compose/.env}",
                "secretKey": "${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/compose/.env}"
              }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }

volumes:
  db-data:
  uploads:
  storage-data:
